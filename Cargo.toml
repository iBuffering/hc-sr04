[package]
name = "hc-sr04"
version = "0.1.2"
edition = "2024"
authors = ["Marco Radocchia <marco.radocchia@outlook.com"]
description = "Raspberry Pi Rust driver for the HC-SR04 ultrasonic distance sensor."
readme = "README.md"
repository = "https://github.com/marcoradocchia/hc-sr04"
license = "GPL-3.0-only"
keywords = ["hc-sr04", "ultrasonic", "distance", "sensor", "raspberry-pi"]
categories = ["hardware-support"]

[features]
cmdline-utils = ["dep:clap"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[example]]
name = "distance"
path = "examples/distance.rs"

[[bin]]
name = "hc-sr04"
path = "src/bin.rs"
required-features = ["cmdline-utils"]

[dependencies]
clap = { version = "4.5.47", features = ["derive"], optional = true }
rppal = "0.22.1"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
